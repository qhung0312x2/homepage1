    <style>
        /* Tối ưu giao diện Game đồng bộ với style.css */
        .game-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            margin-top: 20px;
        }

        @media (max-width: 850px) {
            .game-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel-box {
            background-color: #f8f8f8;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e3e3e3;
            margin-top: 8px;
        }

        .score-num {
            font-size: 16px;
            font-weight: bold;
            color: #215b16;
            margin-top: 2px;
        }

        .opt-group {
            margin-bottom: 12px;
        }

        .opt-group label {
            display: block;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 6px;
            color: #333;
        }

        .btn-toggle-group {
            display: flex;
            gap: 6px;
        }

        .btn-toggle {
            flex: 1;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #cfcfcf;
            background: #ffffff;
            color: #333;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-toggle.active {
            background-color: #215b16;
            color: #ffffff;
            border-color: #215b16;
        }

        .action-btn {
            width: 100%;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background-color: #215b16;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: #5b2874;
            color: #ffffff;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        /* Khung bàn cờ Tic-Tac-Toe */
        .board-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            padding: 24px;
            min-height: 420px;
        }

        .turn-indicator {
            background: #eaf3db;
            border: 1px solid #a8c679;
            color: #2b5722;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 10px;
        }

        .ttt-board.size-5 {
            grid-template-columns: repeat(5, 60px);
            gap: 6px;
        }

        .ttt-cell {
            width: 90px;
            height: 90px;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 2.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .ttt-board.size-5 .ttt-cell {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            border-radius: 8px;
        }

        .ttt-cell:hover {
            background: #f1f5f9;
            border-color: #215b16;
        }

        .ttt-cell.x {
            color: #215b16;
        }

        .ttt-cell.o {
            color: #5b2874;
        }

        .ttt-cell.winning-cell {
            background-color: #93b954;
            color: #ffffff;
            border-color: #215b16;
        }
    </style>
</head>

                    <button id="searchBtn" type="button" aria-label="검색">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>

        <main>
            <h1 class="section-title">미니 게임 (Tic-Tac-Toe)</h1>
            <p style="margin-bottom: 15px; color: #666; font-size: 12px;">
                인공지능(AI) 대결 또는 2인 플레이 모드로 틱택토 게임을 즐기실 수 있습니다.
            </p>

            <div class="game-layout">
                <!-- Cột điều khiển bên trái -->
                <div class="controls-col">
                    <!-- Bảng điểm -->
                    <div class="panel-box">
                        <div style="font-weight: bold; font-size: 13px; color: #333;">📊 전적 스코어보드</div>
                        <div class="score-grid">
                            <div>
                                <div style="font-size: 11px; color: #666;">승리 (X)</div>
                                <div class="score-num" id="winCount">0</div>
                            </div>
                            <div>
                                <div style="font-size: 11px; color: #666;">패배 (O)</div>
                                <div class="score-num" id="lossCount" style="color: #5b2874;">0</div>
                            </div>
                            <div>
                                <div style="font-size: 11px; color: #666;">무승부</div>
                                <div class="score-num" id="drawCount" style="color: #666;">0</div>
                            </div>
                            <div>
                                <div style="font-size: 11px; color: #666;">연승</div>
                                <div class="score-num" id="streakCount" style="color: #d97706;">0</div>
                            </div>
                        </div>
                    </div>

                    <!-- Tùy chọn game -->
                    <div class="panel-box">
                        <div class="opt-group">
                            <label>대전 모드 선택</label>
                            <div class="btn-toggle-group">
                                <button class="btn-toggle active" id="btnModeAi" onclick="setGameMode('ai')">🤖 AI 대결</button>
                                <button class="btn-toggle" id="btnModePvp" onclick="setGameMode('pvp')">👥 2인 플레이</button>
                            </div>
                        </div>

                        <div class="opt-group" id="aiDiffContainer">
                            <label>AI 난이도 설정</label>
                            <div class="btn-toggle-group">
                                <button class="btn-toggle" id="diffEasy" onclick="setDifficulty('easy')">쉬움</button>
                                <button class="btn-toggle" id="diffMedium" onclick="setDifficulty('medium')">보통</button>
                                <button class="btn-toggle active" id="diffHard" onclick="setDifficulty('hard')">최고 난이도</button>
                            </div>
                        </div>

                        <div class="opt-group">
                            <label>보드 크기</label>
                            <div class="btn-toggle-group">
                                <button class="btn-toggle active" id="size3" onclick="setBoardSize(3)">3 x 3 (클래식)</button>
                                <button class="btn-toggle" id="size5" onclick="setBoardSize(5)">5 x 5 (4목 승리)</button>
                            </div>
                        </div>

                        <button class="action-btn btn-primary" onclick="resetGame()">🔄 게임 다시 시작</button>
                        <button class="action-btn btn-secondary" onclick="resetScore()">점수 초기화</button>
                    </div>
                </div>

                <!-- Cột bàn cờ bên phải -->
                <div class="board-col">
                    <div class="board-wrapper">
                        <div class="turn-indicator" id="turnStatus">
                            당신의 차례입니다 (X)
                        </div>
                        <div class="ttt-board" id="board"></div>
                    </div>
                </div>
            </div>
        </main>
